config_schema_version: "v4.0.0"

required_fields:
  - run_id
  - dataset
  - method
  - seed
  - models
  - paths
  - tokenizer

optional_fields:
  - promotion
  - decay
  - dual_index
  - notes


FORBIDDEN_KEYS:
  - "governance"
  - "rbac"
  - "memory_access"
  - "access_label"
  - "deterministic_access_comparison"
  - "redaction_accuracy"
  - "over_refusal"
  - "allow_redact_refuse"
  - "evermemos"
  - "solution1"
  - "max_docs"
  - "max_queries"
  - "n_evidence_max"
  - "first_n"
  - "subset"
  - "limit_queries"
  - "limit_docs"
  - "sample_queries"
  - "random_query_subsample"
  - "skip_failed_queries"

FORBIDDEN_DATASETS:
  - "locomo"
  - "locomo_plus"
  - "locomo10"
  - "own_memondemand_subset"
  - "erag_subset"

promotion_schema:
  required:
    - score_weights
    - decision_mode
    - promotion_budget
  optional:
    - decision_log_path

decay_schema:
  required:
    - tau
    - decay_window
    - utility_floor
  optional:
    - precompute_baseline
